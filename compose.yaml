name: affine-stack

# AFFiNE self-host + MCP automation agent
# Deploy via Portainer → Stacks → Add stack (Git repository or Web editor)

services:
  affine:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine_server
    ports:
      - '${PORT:-3010}:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      manticoresearch:
        condition: service_started
      affine_migration:
        condition: service_completed_successfully
    # Wait for the HTTP server to actually be listening on :3010 before
    # dependents (mcp_agent) start. Plain "service_started" only waits for
    # the container, not for the app inside to bind the port — AFFiNE takes
    # ~30–60s to boot. Uses node (already in the image) for a TCP probe.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3010,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - affine_storage:/root/.affine/storage
      - affine_config:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      # Full-text + semantic search via Manticore (see manticoresearch service below).
      - AFFINE_INDEXER_ENABLED=${AFFINE_INDEXER_ENABLED:-true}
      - AFFINE_INDEXER_SEARCH_PROVIDER=manticoresearch
      - AFFINE_INDEXER_SEARCH_ENDPOINT=http://manticoresearch:9308
      # Public URL config — pick ONE of these approaches:
      #   (a) AFFINE_SERVER_EXTERNAL_URL=https://affine.example.com  (single URL)
      #   (b) AFFINE_SERVER_HOST=affine.example.com + AFFINE_SERVER_HTTPS=true
      - AFFINE_SERVER_EXTERNAL_URL=${AFFINE_SERVER_EXTERNAL_URL:-http://localhost:3010}
      - AFFINE_SERVER_HOST=${AFFINE_SERVER_HOST:-}
      - AFFINE_SERVER_HTTPS=${AFFINE_SERVER_HTTPS:-}
      - MAILER_HOST=${MAILER_HOST:-}
      - MAILER_PORT=${MAILER_PORT:-}
      - MAILER_USER=${MAILER_USER:-}
      - MAILER_PASSWORD=${MAILER_PASSWORD:-}
      - MAILER_SENDER=${MAILER_SENDER:-}
    restart: unless-stopped
    networks:
      - affine_net
      - shared_net

  affine_migration:
    image: ghcr.io/toeverything/affine:${AFFINE_REVISION:-stable}
    container_name: affine_migration_job
    volumes:
      - affine_storage:/root/.affine/storage
      - affine_config:/root/.affine/config
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      # Match the main server so pre-deploy script doesn't complain about
      # missing indexer config when features are cross-referenced.
      - AFFINE_INDEXER_ENABLED=${AFFINE_INDEXER_ENABLED:-true}
      - AFFINE_INDEXER_SEARCH_PROVIDER=manticoresearch
      - AFFINE_INDEXER_SEARCH_ENDPOINT=http://manticoresearch:9308
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - affine_net

  redis:
    image: redis:7-alpine
    container_name: affine_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - affine_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: affine_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-affine}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME}', '-d', '${DB_DATABASE:-affine}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - affine_net

  # Manticore search engine — powers AFFiNE's keyword_search and
  # semantic_search MCP tools. Without this (or with AFFINE_INDEXER_ENABLED=false),
  # those two tools return "Search provider not found".
  #
  # Manticore is light (~100MB), supports both full-text and vector search,
  # and is what AFFiNE's own dev compose uses. AFFiNE auto-indexes existing
  # workspaces in the background (batchSize=10 per tick) once enabled.
  manticoresearch:
    image: manticoresearch/manticore:${MANTICORE_VERSION:-10.1.0}
    container_name: affine_manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - manticore_data:/var/lib/manticore
    # Intentionally no healthcheck — the manticore image doesn't ship with
    # curl/wget and `searchd --status` can timeout on boot even when the
    # daemon is listening, which then blocks the whole stack from starting.
    # AFFiNE's own dev compose omits the healthcheck too; the server side
    # retries on connection failure.
    restart: unless-stopped
    networks:
      - affine_net

  # MCP extension proxy. Serves as the SINGLE MCP endpoint clients use
  # (mcp_agent, n8n, Claude Desktop, etc.). Internally:
  #   - For tools AFFiNE already has (doc-read, doc-*-search), forwards to
  #     AFFiNE's built-in MCP at /api/workspaces/<id>/mcp.
  #   - For missing tools (list_documents, get_workspace_info, list_comments,
  #     list_workspace_members, list_document_history, get_document_info),
  #     implements them via AFFiNE's GraphQL API.
  # See ./mcp-ext/src/tools.ts for the full list.
  mcp_ext:
    build:
      context: ./mcp-ext
      dockerfile: Dockerfile
    image: affine-mcp-ext:local
    pull_policy: build
    container_name: affine_mcp_ext
    depends_on:
      affine:
        condition: service_healthy
    # Publishing this port makes the extended MCP reachable from outside
    # the Docker host — needed for Claude Desktop, Cursor, or any other
    # MCP-capable client running on your laptop. To restrict to localhost
    # only, set MCP_EXT_BIND=127.0.0.1 in the stack env.
    ports:
      - '${MCP_EXT_BIND:-0.0.0.0}:${MCP_EXT_PORT:-3100}:3100'
    environment:
      - AFFINE_BASE_URL=http://affine:3010
      - AFFINE_WORKSPACE_ID=${AFFINE_WORKSPACE_ID:-}
      - AFFINE_ACCESS_TOKEN=${AFFINE_ACCESS_TOKEN:-}
      - PORT=3100
      - TZ=${TZ:-UTC}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - affine_net
      - shared_net  # so n8n (and other stacks) can reach the proxy too

  mcp_agent:
    build:
      context: ./mcp-agent
      dockerfile: Dockerfile
    image: affine-mcp-agent:local
    # Never try to pull this image from a registry — it's built locally.
    # Without this, Portainer's "Pull and redeploy" fails because
    # affine-mcp-agent:local doesn't exist in any registry.
    pull_policy: build
    container_name: affine_mcp_agent
    depends_on:
      mcp_ext:
        condition: service_healthy
    environment:
      # Agent now talks to the extension proxy, not AFFiNE directly.
      # AFFINE_MCP_ENDPOINT overrides the URL built from base+workspace.
      - AFFINE_BASE_URL=http://mcp_ext:3100
      - AFFINE_MCP_ENDPOINT=http://mcp_ext:3100/
      - AFFINE_WORKSPACE_ID=${AFFINE_WORKSPACE_ID:-}
      - AFFINE_ACCESS_TOKEN=${AFFINE_ACCESS_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - REORG_THRESHOLD=${REORG_THRESHOLD_DEFAULT:-15}
      - TZ=${TZ:-UTC}
    restart: unless-stopped
    networks:
      - affine_net

  # imputnet/cobalt — media downloader API. Replaces direct yt-dlp use
  # for platforms that aggressively bot-detect (YouTube, Instagram,
  # TikTok, X). The cobalt project tracks the platform-fight upstream
  # so we don't have to maintain cookie jars or POT solvers ourselves.
  # Internal-only by default — accessed by the ingest worker over the
  # affine_net network.
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: affine_cobalt
    environment:
      # API_URL is what cobalt advertises in CORS / response URLs. For
      # internal-only use the docker-network URL is fine; switch to a
      # public URL only if you also publish the port + put it behind a
      # reverse proxy.
      - API_URL=http://cobalt:9000/
      - DURATION_LIMIT=${COBALT_DURATION_LIMIT:-10800}
      # Phase 12 / 12.5 hotfix: cobalt v11 expects its OWN JSON format
      # ({"youtube":["k=v; k=v"]}) — NOT Netscape. The ingest service
      # converts on upload and writes cobalt.json alongside the
      # Netscape youtube.txt. Both live on the shared yt_cookies tmpfs.
      - COOKIE_PATH=/cookies/cobalt.json
      # Phase 12.5 fix #4: cookies alone don't authenticate on cloud IPs
      # since YT enforced PO tokens (late 2024). The yt_session_server
      # sidecar mints poToken + visitor_data via BotGuard — cobalt sends
      # those alongside the cookies, which gets us past the bot wall.
      # Without this, every YT request returns error.api.youtube.login
      # regardless of cookie quality.
      - YOUTUBE_SESSION_SERVER=http://yt_session_server:8080/
    volumes:
      - yt_cookies:/cookies:ro
    depends_on:
      yt_session_server:
        # service_started, NOT service_healthy. yt-session-generator's
        # webserver image doesn't ship wget/curl and only exposes
        # `/token` (which generates a token via BotGuard — too expensive
        # to hit every 30s as a healthcheck). With service_started,
        # cobalt may race ahead and log "Failed loading poToken" on
        # first boot — the documented manual `docker restart
        # affine_cobalt` step after the extension first syncs catches
        # this up.
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - affine_net

  # Phase 12.5 fix #4: PO token + visitor_data generator for cobalt.
  # https://github.com/imputnet/yt-session-generator — runs YouTube's
  # BotGuard JS (headless Chromium) to produce the auth artifacts
  # cobalt needs alongside cookies. Stateless, no creds.
  # No healthcheck: the image has no wget/curl and the only endpoints
  # are GET /token (expensive — generates a fresh token via BotGuard)
  # and POST /update. Healthcheck-by-/token would burn CPU every 30s
  # for no net benefit. cobalt_watchdog handles the boot-order race:
  # by the time the extension uploads cookies and the watchdog
  # restarts cobalt, Chromium has long since finished booting here.
  yt_session_server:
    image: ghcr.io/imputnet/yt-session-generator:webserver
    container_name: affine_yt_session_server
    restart: unless-stopped
    networks:
      - affine_net

  # Phase 12.5 fix #5: cobalt loads cookies + poToken ONCE at boot and
  # never re-reads. On a fresh stack deploy the cookies file doesn't
  # exist yet (extension syncs AFTER stack is up) → cobalt boots with
  # empty cookies and stays that way. This watchdog notices the file's
  # missing→present transition and runs `docker restart affine_cobalt`
  # exactly once. On the second boot, cookies + poToken both load
  # cleanly. After that, cobalt's in-memory state self-rotates from
  # YT's Set-Cookie responses and the extension's continuous re-syncs
  # don't trigger further restarts (the file stays "present").
  cobalt_watchdog:
    image: docker:cli
    container_name: affine_cobalt_watchdog
    command:
      - sh
      - -c
      - |
        WAS_VALID="false"
        echo "[watchdog] starting; will restart affine_cobalt when /cookies/cobalt.json appears"
        while true; do
          if [ -s /cookies/cobalt.json ] && grep -q '"youtube"' /cookies/cobalt.json 2>/dev/null; then
            if [ "$$WAS_VALID" = "false" ]; then
              echo "[watchdog] cobalt.json valid; restarting affine_cobalt"
              if docker restart affine_cobalt; then
                WAS_VALID="true"
              else
                echo "[watchdog] docker restart failed; will retry next tick"
              fi
            fi
          else
            WAS_VALID="false"
          fi
          sleep 10
        done
    volumes:
      - yt_cookies:/cookies:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - affine_net

  # One-shot job: ensures `affine_ingest` database exists, enables
  # pgvector, and applies migrations. Mirrors the affine_migration pattern.
  # Idempotent — safe to run on every stack update.
  ingest_migration:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    image: affine-ingest:local
    pull_policy: build
    container_name: affine_ingest_migration
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.migrate"]
    environment:
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/affine_ingest
      - DB_ADMIN_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/postgres
    restart: 'no'
    networks:
      - affine_net

  # Python ingest service. Single container runs FastAPI + asyncio worker
  # in one process. All AFFiNE writes route through mcp_ext:3100. All
  # GPU-bound inference (LLM, transcription) hits hosted APIs.
  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    image: affine-ingest:local
    pull_policy: build
    container_name: affine_ingest
    depends_on:
      ingest_migration:
        condition: service_completed_successfully
      mcp_ext:
        condition: service_healthy
      postgres:
        condition: service_healthy
      cobalt:
        condition: service_healthy
    ports:
      - '${INGEST_BIND:-0.0.0.0}:${INGEST_PORT:-3200}:3200'
    environment:
      - PORT=3200
      - INGEST_API_TOKEN=${INGEST_API_TOKEN:-}
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/affine_ingest
      - MCP_EXT_URL=http://mcp_ext:3100
      - COBALT_API_URL=${COBALT_API_URL:-http://cobalt:9000}
      # MCP client to mcp_ext authenticates with the AFFiNE workspace token.
      # Without this every synchronous /capture call fails with
      # `httpx.LocalProtocolError: Illegal header value b'Bearer '`. The
      # workspace id + external URL are used by _build_web_url to construct
      # the doc link returned to the iOS client.
      - AFFINE_ACCESS_TOKEN=${AFFINE_ACCESS_TOKEN:-}
      - AFFINE_WORKSPACE_ID=${AFFINE_WORKSPACE_ID:-}
      - AFFINE_SERVER_EXTERNAL_URL=${AFFINE_SERVER_EXTERNAL_URL:-http://localhost:3010}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MAX_TRANSCRIPT_MIN=${MAX_TRANSCRIPT_MIN:-30}
      - REORG_THRESHOLD_DEFAULT=${REORG_THRESHOLD_DEFAULT:-15}
      - TZ=${TZ:-UTC}
    tmpfs:
      - /tmp/ingest:size=2g
    volumes:
      # Phase 12: shared cookie file (Netscape format) populated by
      # POST /youtube/cookies (browser extension) and consumed by
      # yt-dlp + youtube-transcript-api on every YouTube capture.
      - yt_cookies:/run/cookies
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3200/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - affine_net
      - shared_net

networks:
  affine_net:
    driver: bridge
  # External network shared with other stacks (e.g. n8n). Must be created
  # once on the host BEFORE deploying this stack:
  #   docker network create shared_net
  # Any other stack that also joins `shared_net` (as external) can reach
  # this AFFiNE instance at http://affine:3010
  shared_net:
    external: true
    name: ${SHARED_NETWORK:-shared_net}

volumes:
  postgres_data:
  redis_data:
  affine_storage:
  affine_config:
  manticore_data:
  # Phase 12: tmpfs-backed shared volume holding the Netscape cookies.txt
  # uploaded by the browser extension. ingest writes (rw), cobalt reads (ro).
  # tmpfs because cookies are short-lived and we don't want them on disk;
  # extension auto-replenishes after container restart.
  yt_cookies:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m"
