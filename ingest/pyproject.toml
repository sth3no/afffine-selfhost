[project]
name = "affine-ingest"
version = "0.1.0"
description = "AFFiNE ingest service — captures URLs from iOS, files into Sources/"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-ulid>=2.4",
    "yt-dlp>=2025.1.0",
    "youtube-transcript-api>=1.0.0",
    "markitdown>=0.0.1",
    "openai>=1.40",
    "anthropic>=0.40",
    "numpy>=1.26",
    "scenedetect[opencv]>=0.6.4",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running mcp_ext + AFFiNE stack and INTEGRATION=1 env",
]
