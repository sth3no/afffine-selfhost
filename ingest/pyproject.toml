[project]
name = "affine-ingest"
version = "0.1.0"
description = "AFFiNE ingest service — captures URLs from iOS, files into Sources/"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "asyncpg>=0.31",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14",
    "httpx>=0.28",
    "pyyaml>=6.0.3",
    "python-ulid>=3.1",
    "yt-dlp>=2026.7.4",
    "bgutil-ytdlp-pot-provider>=1.3",
    "youtube-transcript-api>=1.2",
    "markitdown>=0.1.6",
    "openai>=2.45",
    "anthropic>=0.116",
    "numpy>=2.5",
    "scenedetect[opencv]>=0.7",
    "Pillow>=12.0",
    "markdown-it-py>=4.2",
    "imagehash>=4.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running mcp_ext + AFFiNE stack and INTEGRATION=1 env",
]
